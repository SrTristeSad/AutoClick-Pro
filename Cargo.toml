[package]
name = "autoclick-pro-native"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
build = "build.rs"
description = "AutoClick-Pro: implementação nativa Rust + Slint para Windows"

[dependencies]
slint = { version = "=1.14.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
slint-build = "=1.14.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
